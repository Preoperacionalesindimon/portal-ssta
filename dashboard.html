<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permisos · Portal SSTA</title>
<link rel="stylesheet" href="common.css">
<style>
  body{margin:0;font-family:var(--font-family,-apple-system,sans-serif);background:var(--bg,#eef1f4);color:var(--ink,#1a1a1a);padding:1.5rem 1rem 3rem;}
  .wrapper{max-width:760px;margin:0 auto;}
  .header{background:var(--ink,#151b24);border-radius:14px;padding:1.1rem 1.4rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow-lift);}
  .header h1{font-family:var(--font-display);font-size:17px;margin:0;color:#fff;font-weight:700;}
  .header a{font-size:12.5px;color:#ffd84d;text-decoration:none;font-weight:600;}

  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab{flex:1;text-align:center;padding:11px 8px;border-radius:10px;border:1.5px solid var(--line,#d9d9d9);background:var(--paper,#fff);font-size:13px;font-weight:700;color:var(--ink-soft,#666);cursor:pointer;}
  .tab.active{background:var(--ink,#151b24);color:#fff;border-color:var(--ink,#151b24);}
  .tab .count{margin-left:5px;opacity:.75;}

  .searchbar{margin-bottom:12px;}
  .searchbar input{width:100%;box-sizing:border-box;border:1.5px solid var(--line,#d9d9d9);border-radius:10px;padding:12px 14px;font-size:15px;background:var(--paper,#fff);}

  .refresh-note{font-size:11.5px;color:var(--ink-soft,#888);margin:0 0 1rem;}

  /* Aviso de backends que no respondieron. Rojo y arriba de la lista a
     propósito: significa que la lista está INCOMPLETA, y en un tablero de
     permisos una lista incompleta que parece completa es una falsa tranquilidad. */
  .aviso-incompleto{display:none;background:#fdecea;border:1.5px solid #c0392b;color:#7a1f14;
    border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:13px;line-height:1.5;}
  .aviso-incompleto b{display:block;font-size:14px;margin-bottom:2px;}
  .aviso-incompleto ul{margin:6px 0 8px;padding-left:18px;}
  .aviso-incompleto button{min-height:var(--touch,44px);padding:0 16px;border:none;border-radius:8px;
    background:#c0392b;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
  .empty.incompleto{border:1.5px solid #c0392b;color:#7a1f14;background:#fdecea;}
  .list{display:flex;flex-direction:column;gap:10px;}
  .item{display:block;background:var(--paper,#fff);border:1px solid var(--line,#d9d9d9);border-radius:12px;padding:.9rem 1.1rem;border-left:5px solid #F2C200;transition:.15s;text-decoration:none;color:inherit;}
  .item:active{transform:scale(.99);}
  .item.warn{border-left-color:var(--warn,#c0392b);background:linear-gradient(90deg, rgba(192,57,43,.05), transparent 40%);}
  .item.closed{border-left-color:var(--ink-muted,#5c6a76);}
  .item .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .icon-type{font-size:15px;margin-right:4px;}
  .code{font-family:var(--font-display);font-weight:700;background:var(--ink,#123a63);color:#fff;padding:3px 9px;border-radius:5px;font-size:12px;letter-spacing:.02em;}
  .tipo{font-size:11px;color:var(--ink-soft,#888);text-transform:uppercase;letter-spacing:.3px;}
  .tiempo{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .tiempo.ok{color:var(--ok,#1d7a4c);background:rgba(29,122,76,.1);}
  .tiempo.warn{color:var(--warn,#c0392b);background:rgba(192,57,43,.12);}
  .tiempo.closed{color:#5c6570;background:rgba(90,100,110,.1);}
  /* Por vencer: ámbar, un aviso distinto del rojo de "ya venció". */
  .tiempo.pronto{color:#8a6800;background:rgba(224,168,0,.18);}
  .item.v-vencido{border-left-color:var(--warn,#c0392b);background:linear-gradient(90deg, rgba(192,57,43,.07), transparent 45%);}
  .item.v-porvencer{border-left-color:#e0a800;background:linear-gradient(90deg, rgba(224,168,0,.09), transparent 45%);}
  .item.v-vigente{border-left-color:var(--ok,#1d7a4c);}
  .meta{font-size:12px;color:var(--ink-soft,#666);margin-top:6px;}
  .chevron{font-size:var(--fs-menor,12.5px);color:var(--ink-muted,#5c6a76);margin-top:3px;}
  .empty{background:var(--paper,#fff);border:1px solid var(--line,#d9d9d9);border-radius:14px;padding:2rem;text-align:center;color:var(--ink-soft,#888);font-size:13px;}
  .loading{text-align:center;color:#888;font-size:13px;padding:2rem;}

  /* Tarjeta de persona con EPP pendiente de reponer. Antes esta información
     solo existía persona por persona dentro del módulo de EPP, o en el correo
     del día: quien supervisa no tenía dónde ver de una sola vez qué le debe
     a la cuadrilla. */
  .item.epp{border-left-color:var(--warn,#c0392b);}
  .item.epp .elementos{font-size:12.5px;color:var(--ink,#151b24);margin-top:6px;line-height:1.55;}
  .item.epp .elementos li{margin-bottom:2px;}
  .item.epp ul{margin:4px 0 0;padding-left:18px;}
  .desde{font-size:11.5px;color:var(--ink-soft,#5c6a76);margin-top:5px;}
  .desde b{color:var(--warn,#c0392b);}

  /* ══ Tablero rediseñado ══ */
  .wrapper{max-width:880px;}
  .resumen-tablero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .rt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:16px;border:1px solid var(--pui-line,#e7e4dd);
    background:var(--pui-panel,#fff);color:var(--pui-text,#151b24);font:inherit;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;}
  .rt b{font-family:var(--font-display);font-size:32px;line-height:1;font-weight:700;letter-spacing:-.02em;}
  .rt small{font-size:12.5px;color:var(--pui-muted,#5c6a76);}
  .rt.sel{border-color:var(--pui-text,#151b24);box-shadow:inset 0 0 0 1px var(--pui-text,#151b24);}
  .rt-vencido.hay{background:rgba(192,57,43,.1);border-color:rgba(192,57,43,.4);}
  .rt-vencido.hay b{color:#c0392b;}
  .rt-pronto.hay{background:rgba(224,168,0,.14);border-color:rgba(224,168,0,.5);}
  .rt-pronto.hay b{color:#8a6800;}
  html.oscuro .rt-vencido.hay b{color:#ff8a7a;} html.oscuro .rt-pronto.hay b{color:#f1c84b;}
  .tabs .tab{border-radius:12px;}
  .searchbar input{border-radius:12px;min-height:48px;}
  .filtros{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-2px 0 12px;padding-bottom:2px;}
  .filtros::-webkit-scrollbar{display:none;}
  .filtro{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px 0 10px;border-radius:999px;
    border:1px solid var(--pui-line,#e7e4dd);background:var(--pui-panel,#fff);color:var(--pui-text,#151b24);font:inherit;font-size:13px;font-weight:600;cursor:pointer;}
  .filtro i{width:10px;height:10px;border-radius:50%;background:var(--c);}
  .filtro .n{font-weight:500;color:var(--pui-muted,#5c6a76);}
  .filtro.sel{background:var(--pui-text,#151b24);color:var(--pui-panel,#fff);border-color:transparent;}
  .filtro.sel .n{color:inherit;opacity:.7;}

  .list{gap:10px;}
  .item{display:grid;grid-template-columns:48px 1fr;column-gap:14px;align-items:start;padding:14px 16px;border-radius:18px;
    border:1px solid var(--pui-line,#e7e4dd) !important;border-left:1px solid var(--pui-line,#e7e4dd) !important;background:var(--pui-panel,#fff) !important;
    position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s;}
  .item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--estado,transparent);}
  .item:hover{box-shadow:0 8px 22px rgba(15,25,35,.08);border-color:var(--c) !important;}
  .item.v-vencido{--estado:#c0392b;} .item.v-porvencer{--estado:#e0a800;} .item.warn{--estado:#c0392b;}
  .t-ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);grid-row:1 / span 4;}
  html.oscuro .t-ico{background:color-mix(in srgb,var(--c) 26%,transparent);color:color-mix(in srgb,var(--c) 55%,white);}
  .t-ico svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
  .item .row1{grid-column:2;display:flex;justify-content:space-between;align-items:flex-start;gap:6px 8px;flex-wrap:wrap;}
  .t-id{min-width:0;}
  .item .code{display:block;white-space:nowrap;background:none;color:var(--pui-text,#151b24);padding:0;font-size:15.5px;letter-spacing:0;border-radius:0;}
  .item .tipo{display:block;font-size:12px;font-weight:600;color:var(--c);text-transform:none;letter-spacing:0;margin-top:1px;}
  html.oscuro .item .tipo{color:color-mix(in srgb,var(--c) 55%,white);}
  .tiempo{font-size:12.5px;padding:5px 11px;flex-shrink:0;}
  html.oscuro .tiempo.ok{color:#7fd3a8;} html.oscuro .tiempo.warn{color:#ff9c8e;background:rgba(192,57,43,.22);}
  html.oscuro .tiempo.pronto{color:#f1c84b;} html.oscuro .tiempo.closed{color:#c3cad1;background:rgba(255,255,255,.08);}
  .item .meta{grid-column:2;font-size:13px;color:var(--pui-muted,#5c6a76);margin-top:8px;line-height:1.45;display:flex;flex-wrap:wrap;gap:4px 14px;}
  .item .meta span{display:inline-flex;align-items:center;gap:5px;}
  .item .meta svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .item .meta .trab{flex-basis:100%;color:var(--pui-text,#151b24);}
  .vida{grid-column:2;height:6px;border-radius:6px;background:var(--pui-card,#f0eee9);margin-top:10px;overflow:hidden;}
  .vida i{display:block;height:100%;border-radius:6px;background:#2f9a62;}
  .v-porvencer .vida i{background:#e0a800;} .v-vencido .vida i{background:#c0392b;width:100% !important;}
  .vida-txt{grid-column:2;display:flex;justify-content:space-between;font-size:11.5px;color:var(--pui-muted,#5c6a76);margin-top:4px;}
  .item .chevron{display:none;}
  .item.closed{opacity:.92;}
  .refresh-note{display:flex;align-items:center;gap:8px;}
  .refresh-note::before{content:"";width:8px;height:8px;border-radius:50%;background:#2fbf71;flex-shrink:0;}
  .esqueleto{height:118px;border-radius:18px;background:linear-gradient(90deg,var(--pui-card,#f0eee9),var(--pui-panel,#fff),var(--pui-card,#f0eee9));background-size:200% 100%;animation:brillo 1.2s linear infinite;}
  @keyframes brillo{from{background-position:200% 0}to{background-position:-200% 0}}
  @media (min-width:1000px){
    .wrapper{max-width:1180px;}
    .list{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;}
    .list > .empty,.list > .esqueleto{grid-column:1 / -1;}
    .resumen-tablero{grid-template-columns:repeat(3,minmax(0,220px));}
  }
  @media (min-width:1500px){ .wrapper{max-width:1500px;} .list{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media (max-width:600px){ .rt b{font-size:26px;} .item{grid-template-columns:42px 1fr;column-gap:12px;padding:12px 14px;} .t-ico{width:42px;height:42px;border-radius:12px;} }
</style>

<body>
<div class="wrapper">
  <div class="header">
    <div class="marca-titulo"><span class="marca" role="img" aria-label="INDIMON"></span><h1>Tablero SSTA</h1></div>
    <a href="index.html">← Volver al portal</a>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabAbiertos" data-tab="abiertos">Abiertos <span class="count" id="countAbiertos"></span></div>
    <div class="tab" id="tabCerrados" data-tab="cerrados">Histórico cerrados <span class="count" id="countCerrados"></span></div>
  </div>

  <div class="resumen-tablero" id="resumenTablero" aria-live="polite">
    <button type="button" class="rt" data-filtro-vig=""><b id="rtAbiertos">–</b><small>abiertos</small></button>
    <button type="button" class="rt rt-vencido" data-filtro-vig="vencido"><b id="rtVencidos">–</b><small>vencidos</small></button>
    <button type="button" class="rt rt-pronto" data-filtro-vig="porvencer"><b id="rtPronto">–</b><small>vencen en 1 h</small></button>
  </div>

  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="Buscar por código, responsable o tipo…">
  </div>
  <div class="filtros" id="filtrosTipo" role="toolbar" aria-label="Filtrar por tipo"></div>

  <p class="refresh-note" id="refreshNote">Cargando…</p>
  <div class="aviso-incompleto" id="avisoIncompleto" role="alert"></div>
  <div class="list" id="list"></div>
</div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
OfflineBanner.init();

// Mismos backends/token usados en los formularios de permisos.
// Umbral (horas) a partir del cual un permiso abierto se marca en rojo.
const HORAS_ALERTA = 8;
// Antes este arreglo estaba copiado a mano aquí, en index.html y en
// personal-autorizado.html — ahora los tres lo calculan desde config.js,
// así cambiar una URL de backend solo implica editar un archivo.
const PERMIT_BACKENDS = getPermitBackends(false);
// El dashboard mostraba solo los 5 permisos: las inspecciones de EPP vivían en
// otra pantalla, así que había que mirar en dos sitios para saber qué estaba
// pendiente. Aquí se suma la tercera pestaña.
const EPP_BACKEND = PORTAL_CONFIG.BACKENDS.epp;

const TIPOS = {
  caliente:   { nombre:'Caliente',   color:'#c8461a', svg:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>' },
  alturas:    { nombre:'Alturas',    color:'#1c5f99', svg:'<path d="M8 2v20M16 2v20M8 6h8M8 11h8M8 16h8"/>' },
  confinados: { nombre:'Confinados', color:'#6b4c9a', svg:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>' },
  izajes:     { nombre:'Izajes',     color:'#0f7a72', svg:'<path d="M6 21V3l12 4H6M6 7l-3 2M18 7v6M16 13h4v3h-4zM3 21h8"/>' },
  electrico:  { nombre:'Eléctrico',  color:'#b8860b', svg:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>' },
  ats:        { nombre:'ATS',        color:'#0f5e63', svg:'<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z"/>' },
  epp:        { nombre:'EPP',        color:'#c0392b', svg:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>' }
};
const ICO_META = {
  persona:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  lugar:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  reloj:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
};
function claveTipo(nombre){
  if(nombre.includes('Caliente')) return 'caliente';
  if(nombre.includes('Confinados')) return 'confinados';
  if(nombre.includes('Izajes')) return 'izajes';
  if(nombre.includes('Eléctrico')) return 'electrico';
  if(nombre.indexOf('ATS') === 0) return 'ats';
  return 'alturas';
}
function iconoPara(nombre){ return claveTipo(nombre); }
const icoTipo = (k) => '<span class="t-ico"><svg viewBox="0 0 24 24" aria-hidden="true">' + (TIPOS[k]||TIPOS.alturas).svg + '</svg></span>';
const icoMeta = (k, txt, cls) => '<span' + (cls ? ' class="' + cls + '"' : '') + '><svg viewBox="0 0 24 24" aria-hidden="true">' + ICO_META[k] + '</svg>' + txt + '</span>';
let filtroTipo = '';
let filtroVig = '';
/* ── Vencimiento real ──
   El dashboard mostraba solo cuántas horas llevaba abierto un permiso, con un
   umbral fijo de 8 horas igual para todos. Pero cada permiso declara su propia
   vigencia ("hasta" fecha y hora) y ese dato ya estaba guardado sin usarse.
   Para quien supervisa, "vence en 2h" dice mucho más que "lleva 6h abierto". */
function fechaVencimiento(it){
  if(!it.hastaFecha) return null;
  // Se guarda como AAAA-MM-DD y HH:MM. Se arma en hora local, no en UTC: con
  // UTC un permiso que vence a las 6pm aparecía venciendo a la 1pm.
  const [a,m,d] = String(it.hastaFecha).split('-').map(Number);
  if(!a || !m || !d) return null;
  const [hh,mm] = String(it.hastaHora || '23:59').split(':').map(Number);
  const f = new Date(a, m-1, d, isNaN(hh)?23:hh, isNaN(mm)?59:mm, 0, 0);
  return isNaN(f.getTime()) ? null : f;
}

function estadoVigencia(it){
  const vence = fechaVencimiento(it);
  if(!vence) return null;                       // permiso sin vigencia declarada
  const minutos = Math.round((vence.getTime() - Date.now()) / 60000);
  const abs = Math.abs(minutos);
  const texto = abs < 60
    ? abs + ' min'
    : (abs < 1440 ? (abs/60).toFixed(abs/60 < 10 ? 1 : 0) + ' h' : Math.round(abs/1440) + ' d');
  if(minutos < 0)  return { nivel:'vencido',  texto:'VENCIDO hace ' + texto, minutos };
  if(minutos <= 60) return { nivel:'porvencer', texto:'Vence en ' + texto, minutos };
  return { nivel:'vigente', texto:'Vence en ' + texto, minutos };
}

function horasDesde(fechaStr){
  const t = new Date(fechaStr).getTime();
  if(isNaN(t)) return null;
  return (Date.now() - t) / 36e5;
}
function formatHoras(h){
  if(h===null) return '—';
  if(h < 1) return Math.round(h*60)+' min';
  return h.toFixed(1)+' h';
}
function fechaCorta(v){
  const t = new Date(v);
  if(isNaN(t.getTime())) return '—';
  const hoy = new Date(); const mismoDia = t.toDateString() === hoy.toDateString();
  const hora = t.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'}).replace(/\s*a\.\s*m\./,' am').replace(/\s*p\.\s*m\./,' pm');
  return (mismoDia ? 'hoy' : t.toLocaleDateString('es-CO',{day:'numeric',month:'short'}).replace('.','')) + ' ' + hora;
}
function formatFecha(fechaStr){
  const t = new Date(fechaStr);
  if(isNaN(t.getTime())) return '—';
  return t.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + t.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
}

let abiertos = [];
let cerrados = [];
// Tipos de permiso cuyo backend NO respondió en la última consulta:
// [{nombre, motivo}]. Mientras haya alguno, la lista está incompleta.
let fallidos = [];
// null = todavía no se ha consultado nada (no se puede afirmar nada).
let ultimaConsulta = null;
let tabActual = 'abiertos';
let eppPendientes = [];   // [{nombre, cedula, cargo, fecha, inspector, elementos[]}]
let eppCargado = false;

/* ATS en el tablero: antes solo estaban los 5 permisos, así que un ATS
   abierto días después de su fecha no se veía en ningún lado. */
async function cargarAts(){
  const B = PORTAL_CONFIG.BACKENDS.ats;
  const out = { abiertos: [], cerrados: [], fallo: null };
  if(!B || !B.url || B.url.indexOf('http') !== 0) return out;
  try{
    const res = await fetchWithRetry(B.url + '?list=1&token=' + encodeURIComponent(PORTAL_CONFIG.API_TOKEN));
    const data = await res.json();
    if(!data || !data.ok || !Array.isArray(data.rows)){ out.fallo = { nombre:'ATS', motivo:'respondió con error: ' + ((data && data.error) || 'sin detalle') }; return out; }
    data.rows.forEach(r=>{
      const fin = atsVence(r);
      const item = {
        tipo: 'ATS', archivo: 'ats.html', icono: 'ats', esAts: true,
        code: r.code || '—', responsable: r.lider || '',
        area: [r.centroCostos, r.area].filter(Boolean).join(' · '), trabajo: r.trabajo || '',
        hastaFecha: fin ? String(r.fechaHasta || r.fechaDesde).slice(0,10) : '', hastaHora: '23:59',
        fechaApertura: r.fechaDesde || r.updatedAt || null,
        fechaCierre: r.estado === 'CERRADO' ? (r.cerradoEn || r.updatedAt || null) : null
      };
      (r.estado === 'CERRADO' ? out.cerrados : out.abiertos).push(item);
    });
  }catch(err){
    out.fallo = { nombre:'ATS', motivo: (err && err.name === 'SyntaxError') ? 'respondió con una página en vez de datos (revisa el Apps Script del ATS)' : 'no respondió (sin señal o servidor caído)' };
  }
  return out;
}

async function cargar(){
  // Si la pestaña está oculta (en segundo plano) o no hay señal, no tiene sentido
  // consultar los 5 backends — antes esto se disparaba igual cada 2 minutos aunque
  // nadie estuviera mirando el dashboard, gastando cuota de ejecución de Apps
  // Script sin ninguna necesidad real.
  if (document.hidden || !navigator.onLine) return;
  const noteEl = document.getElementById('refreshNote');
  const nAbiertos = [], nCerrados = [], nFallidos = [];
  // Se consultan los 5 backends EN PARALELO (no uno detrás de otro): si alguno
  // está caído o lento, ya no retrasa a los demás — antes, con un backend caído,
  // la carga completa del dashboard podía tardar 10-15 segundos.
  const pAts = cargarAts();
  const resultados = await Promise.allSettled(PERMIT_BACKENDS.map(backend =>
    fetchWithRetry(backend.url + '?' + (backend.listQuery || 'list=1') + '&token=' + encodeURIComponent(backend.token))
      .then(res => res.json())
      .then(data => ({ backend, data }))
  ));
  // ANTES un backend caído se omitía en silencio: si justo ese tenía el único
  // permiso abierto, el tablero mostraba "No hay permisos abiertos ✓".
  // Ahora cada tipo que no respondió queda registrado con su motivo.
  resultados.forEach((r, i)=>{
    if(r.status !== 'fulfilled'){
      const err = r.reason;
      const motivo = (err && err.name === 'SyntaxError')
        ? 'respondió con una página en vez de datos (¿despliegue privado o URL cambiada?)'
        : 'no respondió (sin señal o servidor caído)';
      nFallidos.push({ nombre: PERMIT_BACKENDS[i].nombre, motivo });
      return;
    }
    const { backend, data } = r.value;
    if(!data || !data.ok || !Array.isArray(data.rows)){
      nFallidos.push({ nombre: backend.nombre, motivo: 'respondió con error: ' + ((data && data.error) || 'sin detalle') });
      return;
    }
    data.rows.forEach(row=>{
        const item = {
          tipo: backend.nombre,
          archivo: backend.archivo,
          icono: iconoPara(backend.nombre),
          code: row.code || row.permitCode || '—',
          responsable: row.responsable || '',
          area: row.sitio || row.area || '',
          hastaFecha: row.hastaFecha || '',
          hastaHora: row.hastaHora || '',
          fechaApertura: row.openedAt || row.updatedAt || null,
          fechaCierre: row.status === 'CERRADO' ? (row.closedAt || row.updatedAt || null) : null
        };
        if(row.status === 'ABIERTO') nAbiertos.push(item);
        else if(row.status === 'CERRADO') nCerrados.push(item);
      });
  });
  const rAts = await pAts;
  rAts.abiertos.forEach(x=>nAbiertos.push(x)); rAts.cerrados.forEach(x=>nCerrados.push(x));
  if(rAts.fallo) nFallidos.push(rAts.fallo);
  abiertos = nAbiertos; cerrados = nCerrados; fallidos = nFallidos;
  ultimaConsulta = new Date();
  // Orden por urgencia real: primero lo vencido, luego lo que está por vencer,
  // y al final lo que tiene margen. Los que no declaran vigencia se ordenan
  // como antes, por tiempo abierto.
  abiertos.sort((a,b)=>{
    const va = estadoVigencia(a), vb = estadoVigencia(b);
    if(va && vb) return va.minutos - vb.minutos;      // menos minutos = más urgente
    if(va) return -1;
    if(vb) return 1;
    return (horasDesde(b.fechaApertura)||0) - (horasDesde(a.fechaApertura)||0);
  });
  cerrados.sort((a,b)=> new Date(b.fechaCierre||0) - new Date(a.fechaCierre||0));

  document.getElementById('countAbiertos').textContent = abiertos.length ? '('+abiertos.length+')' : '';
  document.getElementById('countCerrados').textContent = cerrados.length ? '('+cerrados.length+')' : '';
  noteEl.textContent = 'En vivo · actualizado ' + new Date().toLocaleTimeString('es-CO', {hour:'2-digit',minute:'2-digit'}) + ' — se refresca solo cada 2 minutos.';
  mostrarAvisoIncompleto();
  render();
}

/* ── EPP pendiente de reponer ──
   Se toma la ÚLTIMA inspección de cada persona, no la suma de todas: sumar el
   historial mostraría como pendiente lo que ya le repusieron hace meses, y
   este es justo el listado que se usa para reclamarle a almacén. */
async function cargarEpp(){
  if(!EPP_BACKEND || !EPP_BACKEND.url || EPP_BACKEND.url.indexOf('http')!==0) return;
  try{
    const res = await fetchWithRetry(EPP_BACKEND.url + '?list=1&token=' + encodeURIComponent(PORTAL_CONFIG.API_TOKEN));
    const data = await res.json();
    if(!data.ok || !Array.isArray(data.rows)) return;
    const ultimaPorPersona = {};
    data.rows.forEach(r=>{
      const cc = String(r.cedula||'').trim() || String(r.nombre||'').trim();
      if(!cc) return;
      const previa = ultimaPorPersona[cc];
      if(!previa || new Date(r.updatedAt) > new Date(previa.updatedAt)) ultimaPorPersona[cc] = r;
    });
    eppPendientes = Object.values(ultimaPorPersona)
      .map(r=>({
        nombre: r.nombre||'—', cedula: r.cedula||'', cargo: r.cargo||'',
        fecha: r.fechaInspeccion||'', inspector: r.inspector||'', updatedAt: r.updatedAt,
        elementos: String(r.malos||'').split('|').map(x=>x.trim()).filter(Boolean)
      }))
      .filter(p=>p.elementos.length);
    eppPendientes.sort((a,b)=> new Date(a.updatedAt) - new Date(b.updatedAt)); // lo más viejo primero: es lo más atrasado
    eppCargado = true;
    document.getElementById('countEpp').textContent = eppPendientes.length ? '('+eppPendientes.length+')' : '';
  }catch(e){ /* sin señal o backend no configurado: la pestaña queda vacía */ }
}

function diasDesde(v){
  const t = new Date(v).getTime();
  if(isNaN(t)) return null;
  return Math.floor((Date.now()-t)/86400000);
}

function renderEpp(listEl, q){
  let items = eppPendientes;
  if(q){
    items = items.filter(p =>
      p.nombre.toLowerCase().includes(q) || String(p.cedula).toLowerCase().includes(q) ||
      p.cargo.toLowerCase().includes(q) || p.inspector.toLowerCase().includes(q) ||
      p.elementos.join(' ').toLowerCase().includes(q));
  }
  if(!items.length){
    listEl.innerHTML = '<div class="empty">'+(eppCargado
      ? (q ? 'No hay resultados para la búsqueda.' : 'No hay elementos de protección pendientes de reponer ✓')
      : 'Cargando inspecciones de EPP…')+'</div>';
    return;
  }
  listEl.innerHTML = items.map(p=>{
    const d = diasDesde(p.updatedAt);
    const espera = d===null ? '' : (d===0 ? 'hoy' : (d===1 ? 'hace 1 día' : 'hace '+d+' días'));
    return `<a class="item epp" href="inspeccion-epp.html" style="--c:#c0392b">
      ${icoTipo('epp')}
      <div class="row1">
        <span class="t-id"><span class="code">${esc(p.nombre)}</span><span class="tipo">${esc(p.cargo||'')}</span></span>
        <span class="tiempo warn">${p.elementos.length} elemento(s)</span>
      </div>
      <div class="elementos"><ul>${p.elementos.map(e=>'<li>'+esc(e)+'</li>').join('')}</ul></div>
      <div class="desde">Solicitado <b>${esc(espera)}</b>${p.fecha?' · inspección del '+esc(p.fecha):''}${p.inspector?' · revisó '+esc(p.inspector):''}</div>
      <div class="chevron">Toca para abrir la inspección de EPP →</div>
    </a>`;
  }).join('');
}

/** Aviso arriba de la lista con los tipos de permiso que no respondieron. */
function mostrarAvisoIncompleto(){
  const el = document.getElementById('avisoIncompleto');
  if(!fallidos.length){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.innerHTML = '<b>⚠️ Lista incompleta</b>' +
    'No se pudieron consultar estos permisos, así que los suyos <u>no aparecen</u> abajo:' +
    '<ul>' + fallidos.map(f => '<li><b style="display:inline">' + esc(f.nombre) + '</b>: ' + esc(f.motivo) + '</li>').join('') + '</ul>' +
    '<button type="button" id="btnReintentarTablero">Reintentar ahora</button>';
  el.style.display = 'block';
  document.getElementById('btnReintentarTablero').addEventListener('click', (e)=>{
    e.target.textContent = 'Consultando…'; e.target.disabled = true;
    cargar();
  });
}

function pintarResumen(){
  let venc = 0, pronto = 0;
  abiertos.forEach(it => { const v = estadoVigencia(it); if(v && v.nivel==='vencido') venc++; else if(v && v.nivel==='porvencer') pronto++; });
  const pon = (id, n) => { const el = document.getElementById(id); el.textContent = ultimaConsulta ? n : '–'; el.parentElement.classList.toggle('hay', !!n); };
  pon('rtAbiertos', abiertos.length); pon('rtVencidos', venc); pon('rtPronto', pronto);
  document.querySelectorAll('.rt').forEach(b => b.classList.toggle('sel', tabActual==='abiertos' && b.dataset.filtroVig === filtroVig && !!filtroVig));
  // Filtros por tipo, con cuántos hay de cada uno en la pestaña actual
  const base = tabActual === 'abiertos' ? abiertos : cerrados;
  const cuenta = {}; base.forEach(it => { const k = it.icono; cuenta[k] = (cuenta[k]||0) + 1; });
  const cont = document.getElementById('filtrosTipo');
  cont.innerHTML = '<button type="button" class="filtro' + (filtroTipo ? '' : ' sel') + '" data-k="">Todos <span class="n">' + base.length + '</span></button>' +
    Object.keys(TIPOS).filter(k => k !== 'epp' && cuenta[k]).map(k =>
      '<button type="button" class="filtro' + (filtroTipo===k ? ' sel' : '') + '" data-k="' + k + '" style="--c:' + TIPOS[k].color + '"><i></i>' + TIPOS[k].nombre + ' <span class="n">' + cuenta[k] + '</span></button>').join('');
  cont.querySelectorAll('.filtro').forEach(b => b.addEventListener('click', () => { filtroTipo = b.dataset.k; render(); }));
}

function render(){
  const listEl = document.getElementById('list');
  if(tabActual !== 'epp') pintarResumen();
  if(!ultimaConsulta && tabActual !== 'epp'){ listEl.innerHTML = '<div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>'; return; }
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(tabActual === 'epp'){ renderEpp(listEl, q); return; }
  let items = tabActual === 'abiertos' ? abiertos : cerrados;
  if(filtroTipo) items = items.filter(it => it.icono === filtroTipo);
  if(filtroVig && tabActual === 'abiertos') items = items.filter(it => { const v = estadoVigencia(it); return v && v.nivel === filtroVig; });
  if(q){
    items = items.filter(it =>
      it.code.toLowerCase().includes(q) ||
      it.tipo.toLowerCase().includes(q) ||
      (it.responsable||'').toLowerCase().includes(q) ||
      (it.area||'').toLowerCase().includes(q) ||
      (it.trabajo||'').toLowerCase().includes(q)
    );
  }

  if(items.length===0){
    let msg;
    if(tabActual==='abiertos'){
      if(q) msg = 'Ningún permiso ni ATS abierto coincide con la búsqueda.';
      // El chulo verde SOLO cuando los 5 tipos respondieron. Con uno caído no
      // se puede afirmar que no haya permisos abiertos: se dice lo que se sabe.
      else if(fallidos.length) msg = '⚠️ No se puede confirmar que no haya permisos ni ATS abiertos: faltan datos de ' + fallidos.map(f=>esc(f.nombre)).join(', ') + '.';
      else msg = 'No hay permisos ni ATS abiertos en este momento ✓';
    } else {
      msg = fallidos.length ? '⚠️ Faltan datos de ' + fallidos.map(f=>esc(f.nombre)).join(', ') + '. La lista puede estar incompleta.' : 'No hay permisos cerrados que coincidan con la búsqueda.';
    }
    listEl.innerHTML = `<div class="empty${fallidos.length && !q ? ' incompleto' : ''}">${msg}</div>`;
    return;
  }

  if(tabActual==='abiertos'){
    listEl.innerHTML = items.map(it=>{
      const h = horasDesde(it.fechaApertura);
      const v = estadoVigencia(it);
      // Si el permiso declara vigencia, manda ella. Si no (permisos viejos), se
      // sigue usando el umbral de horas abiertas como antes.
      const alerta = v ? (v.nivel !== 'vigente') : (h!==null && h >= HORAS_ALERTA);
      const clase = v ? ('v-' + v.nivel) : (alerta ? 'warn' : '');
      const etiqueta = v
        ? `<span class="tiempo ${v.nivel==='vencido'?'warn':(v.nivel==='porvencer'?'pronto':'ok')}">${esc(v.texto)}</span>`
        : `<span class="tiempo ${alerta?'warn':'ok'}">${formatHoras(h)} abierto</span>`;
      const enlace = it.esAts ? 'ats.html?code=' + encodeURIComponent(it.code) + '&ver=1' : it.archivo + '?code=' + encodeURIComponent(it.code);
      const ap = it.fechaApertura ? new Date(it.fechaApertura).getTime() : NaN;
      const fin = fechaVencimiento(it);
      let pct = null;
      if(fin && !isNaN(ap) && fin.getTime() > ap) pct = Math.max(2, Math.min(100, Math.round((Date.now() - ap) / (fin.getTime() - ap) * 100)));
      const T = TIPOS[it.icono] || TIPOS.alturas;
      return `<a class="item ${clase}" href="${enlace}" style="--c:${T.color}">
        ${icoTipo(it.icono)}
        <div class="row1">
          <span class="t-id"><span class="code">${esc(it.code)}</span><span class="tipo">${esc(it.tipo)}</span></span>
          ${etiqueta}
        </div>
        <div class="meta">${it.esAts && it.trabajo ? '<span class="trab">' + esc(it.trabajo.slice(0,110)) + '</span>' : ''}${it.responsable ? icoMeta('persona', esc(it.responsable)) : ''}${it.area ? icoMeta('lugar', esc(it.area)) : ''}${h!==null ? icoMeta('reloj', 'Abierto hace ' + formatHoras(h)) : ''}</div>
        ${pct!==null ? `<div class="vida" role="img" aria-label="Lleva ${pct}% de su vigencia"><i style="width:${pct}%"></i></div><div class="vida-txt"><span>Desde ${esc(fechaCorta(it.fechaApertura))}</span><span>Hasta ${esc(fechaCorta(fin))}</span></div>` : ''}
      </a>`;
    }).join('');
  } else {
    listEl.innerHTML = items.map(it=>{
      const T = TIPOS[it.icono] || TIPOS.alturas;
      return `<a class="item closed" style="--c:${T.color}" href="${it.esAts ? 'ats.html?code=' + encodeURIComponent(it.code) + '&ver=1' : it.archivo + '?code=' + encodeURIComponent(it.code)}">
        ${icoTipo(it.icono)}
        <div class="row1">
          <span class="t-id"><span class="code">${esc(it.code)}</span><span class="tipo">${esc(it.tipo)}</span></span>
          <span class="tiempo closed">Cerrado</span>
        </div>
        <div class="meta">${it.responsable ? icoMeta('persona', esc(it.responsable)) : ''}${it.area ? icoMeta('lugar', esc(it.area)) : ''}${it.fechaCierre ? icoMeta('reloj', 'Cerrado ' + formatFecha(it.fechaCierre)) : ''}</div>
      </a>`;
    }).join('');
  }
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    tabActual = tab.dataset.tab;
    filtroTipo = '';
    if(tabActual !== 'abiertos') filtroVig = '';
    render();
  });
});
document.getElementById('searchInput').addEventListener('input', render);
document.querySelectorAll('.rt').forEach(b => b.addEventListener('click', () => {
  filtroVig = (filtroVig === b.dataset.filtroVig) ? '' : b.dataset.filtroVig;
  if(tabActual !== 'abiertos') document.getElementById('tabAbiertos').click(); else render();
}));
render();

cargar();
setInterval(cargar, 120000);
// Al volver a la pestaña (o recuperar señal) después de estar oculta/offline,
// refresca de una vez en vez de esperar hasta el próximo intervalo de 2 minutos.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cargar(); });
window.addEventListener('online', cargar);

// El dashboard nunca registraba el Service Worker — si alguien entraba por un
// enlace directo a esta página (sin pasar antes por index.html), el modo
// offline no quedaba instalado y tampoco aparecía el banner de actualización.
window.addEventListener('load', ()=>{
  if (typeof UpdateManager !== 'undefined') UpdateManager.init();
});
</script>
