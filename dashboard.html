<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permisos · Portal SSTA</title>
<link rel="stylesheet" href="common.css">
<style>
  body{margin:0;font-family:var(--font-family,-apple-system,sans-serif);background:var(--bg,#eef1f4);color:var(--ink,#1a1a1a);padding:1.5rem 1rem 3rem;}
  .wrapper{max-width:760px;margin:0 auto;}
  .header{background:var(--ink,#151b24);border-radius:14px;padding:1.1rem 1.4rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow-lift);}
  .header h1{font-family:var(--font-display);font-size:17px;margin:0;color:#fff;font-weight:700;}
  .header a{font-size:12.5px;color:#ffd84d;text-decoration:none;font-weight:600;}

  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab{flex:1;text-align:center;padding:11px 8px;border-radius:10px;border:1.5px solid var(--line,#d9d9d9);background:var(--paper,#fff);font-size:13px;font-weight:700;color:var(--ink-soft,#666);cursor:pointer;}
  .tab.active{background:var(--ink,#151b24);color:#fff;border-color:var(--ink,#151b24);}
  .tab .count{margin-left:5px;opacity:.75;}

  .searchbar{margin-bottom:12px;}
  .searchbar input{width:100%;box-sizing:border-box;border:1.5px solid var(--line,#d9d9d9);border-radius:10px;padding:12px 14px;font-size:15px;background:var(--paper,#fff);}

  .refresh-note{font-size:11.5px;color:var(--ink-soft,#888);margin:0 0 1rem;}
  .list{display:flex;flex-direction:column;gap:10px;}
  .item{display:block;background:var(--paper,#fff);border:1px solid var(--line,#d9d9d9);border-radius:12px;padding:.9rem 1.1rem;border-left:5px solid #F2C200;transition:.15s;text-decoration:none;color:inherit;}
  .item:active{transform:scale(.99);}
  .item.warn{border-left-color:var(--warn,#c0392b);background:linear-gradient(90deg, rgba(192,57,43,.05), transparent 40%);}
  .item.closed{border-left-color:#8a97a3;}
  .item .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .icon-type{font-size:15px;margin-right:4px;}
  .code{font-family:var(--font-display);font-weight:700;background:var(--ink,#123a63);color:#fff;padding:3px 9px;border-radius:5px;font-size:12px;letter-spacing:.02em;}
  .tipo{font-size:11px;color:var(--ink-soft,#888);text-transform:uppercase;letter-spacing:.3px;}
  .tiempo{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .tiempo.ok{color:var(--ok,#1d7a4c);background:rgba(29,122,76,.1);}
  .tiempo.warn{color:var(--warn,#c0392b);background:rgba(192,57,43,.12);}
  .tiempo.closed{color:#5c6570;background:rgba(90,100,110,.1);}
  .meta{font-size:12px;color:var(--ink-soft,#666);margin-top:6px;}
  .chevron{font-size:11px;color:var(--ink-soft,#aab3ba);margin-top:2px;}
  .empty{background:var(--paper,#fff);border:1px solid var(--line,#d9d9d9);border-radius:14px;padding:2rem;text-align:center;color:var(--ink-soft,#888);font-size:13px;}
  .loading{text-align:center;color:#888;font-size:13px;padding:2rem;}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>📋 Permisos</h1>
    <a href="index.html">← Volver al portal</a>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabAbiertos" data-tab="abiertos">Abiertos <span class="count" id="countAbiertos"></span></div>
    <div class="tab" id="tabCerrados" data-tab="cerrados">Histórico cerrados <span class="count" id="countCerrados"></span></div>
  </div>

  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="Buscar por código, responsable o tipo…">
  </div>

  <p class="refresh-note" id="refreshNote">Cargando…</p>
  <div class="list" id="list"></div>
</div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
OfflineBanner.init();

// Mismos backends/token usados en los formularios de permisos.
// Umbral (horas) a partir del cual un permiso abierto se marca en rojo.
const HORAS_ALERTA = 8;
// Antes este arreglo estaba copiado a mano aquí, en index.html y en
// personal-autorizado.html — ahora los tres lo calculan desde config.js,
// así cambiar una URL de backend solo implica editar un archivo.
const PERMIT_BACKENDS = getPermitBackends(false);

function iconoPara(nombre){
  if(nombre.includes('Caliente')) return '🔥';
  if(nombre.includes('Confinados')) return '🕳️';
  if(nombre.includes('Izajes')) return '🏗️';
  if(nombre.includes('Eléctrico')) return '⚡';
  return '🧗';
}
function horasDesde(fechaStr){
  const t = new Date(fechaStr).getTime();
  if(isNaN(t)) return null;
  return (Date.now() - t) / 36e5;
}
function formatHoras(h){
  if(h===null) return '—';
  if(h < 1) return Math.round(h*60)+' min';
  return h.toFixed(1)+' h';
}
function formatFecha(fechaStr){
  const t = new Date(fechaStr);
  if(isNaN(t.getTime())) return '—';
  return t.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + t.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
}

let abiertos = [];
let cerrados = [];
let tabActual = 'abiertos';

async function cargar(){
  // Si la pestaña está oculta (en segundo plano) o no hay señal, no tiene sentido
  // consultar los 5 backends — antes esto se disparaba igual cada 2 minutos aunque
  // nadie estuviera mirando el dashboard, gastando cuota de ejecución de Apps
  // Script sin ninguna necesidad real.
  if (document.hidden || !navigator.onLine) return;
  const noteEl = document.getElementById('refreshNote');
  abiertos = []; cerrados = [];
  // Se consultan los 5 backends EN PARALELO (no uno detrás de otro): si alguno
  // está caído o lento, ya no retrasa a los demás — antes, con un backend caído,
  // la carga completa del dashboard podía tardar 10-15 segundos.
  const resultados = await Promise.allSettled(PERMIT_BACKENDS.map(backend =>
    fetchWithRetry(backend.url + '?' + (backend.listQuery || 'list=1') + '&token=' + encodeURIComponent(backend.token))
      .then(res => res.json())
      .then(data => ({ backend, data }))
  ));
  resultados.forEach(r=>{
    if(r.status !== 'fulfilled') return; // backend no disponible; se omite
    const { backend, data } = r.value;
    if(data.ok && Array.isArray(data.rows)){
      data.rows.forEach(row=>{
        const item = {
          tipo: backend.nombre,
          archivo: backend.archivo,
          icono: iconoPara(backend.nombre),
          code: row.code || row.permitCode || '—',
          responsable: row.responsable || '',
          area: row.sitio || row.area || '',
          fechaApertura: row.openedAt || row.updatedAt || null,
          fechaCierre: row.status === 'CERRADO' ? (row.closedAt || row.updatedAt || null) : null
        };
        if(row.status === 'ABIERTO') abiertos.push(item);
        else if(row.status === 'CERRADO') cerrados.push(item);
      });
    }
  });
  abiertos.sort((a,b)=>(horasDesde(a.fechaApertura)||0) < (horasDesde(b.fechaApertura)||0) ? 1 : -1);
  cerrados.sort((a,b)=> new Date(b.fechaCierre||0) - new Date(a.fechaCierre||0));

  document.getElementById('countAbiertos').textContent = abiertos.length ? '('+abiertos.length+')' : '';
  document.getElementById('countCerrados').textContent = cerrados.length ? '('+cerrados.length+')' : '';
  noteEl.textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-CO', {hour:'2-digit',minute:'2-digit'}) + ' — se refresca solo cada 2 minutos.';
  render();
}

function render(){
  const listEl = document.getElementById('list');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  let items = tabActual === 'abiertos' ? abiertos : cerrados;
  if(q){
    items = items.filter(it =>
      it.code.toLowerCase().includes(q) ||
      it.tipo.toLowerCase().includes(q) ||
      (it.responsable||'').toLowerCase().includes(q) ||
      (it.area||'').toLowerCase().includes(q)
    );
  }

  if(items.length===0){
    listEl.innerHTML = `<div class="empty">${tabActual==='abiertos' ? 'No hay permisos abiertos en este momento ✓' : 'No hay permisos cerrados que coincidan con la búsqueda.'}</div>`;
    return;
  }

  if(tabActual==='abiertos'){
    listEl.innerHTML = items.map(it=>{
      const h = horasDesde(it.fechaApertura);
      const alerta = h!==null && h >= HORAS_ALERTA;
      return `<a class="item ${alerta?'warn':''}" href="${it.archivo}?code=${encodeURIComponent(it.code)}">
        <div class="row1">
          <span><span class="icon-type">${it.icono}</span><span class="code">${esc(it.code)}</span> <span class="tipo">${it.tipo}</span></span>
          <span class="tiempo ${alerta?'warn':'ok'}">${formatHoras(h)} abierto</span>
        </div>
        <div class="meta">${it.responsable ? 'Responsable: '+esc(it.responsable) : ''}${it.area ? ' · Área: '+esc(it.area) : ''}</div>
        <div class="chevron">Toca para abrir el permiso y cerrarlo →</div>
      </a>`;
    }).join('');
  } else {
    listEl.innerHTML = items.map(it=>{
      return `<a class="item closed" href="${it.archivo}?code=${encodeURIComponent(it.code)}">
        <div class="row1">
          <span><span class="icon-type">${it.icono}</span><span class="code">${esc(it.code)}</span> <span class="tipo">${it.tipo}</span></span>
          <span class="tiempo closed">Cerrado</span>
        </div>
        <div class="meta">${it.responsable ? 'Responsable: '+esc(it.responsable) : ''}${it.area ? ' · Área: '+esc(it.area) : ''}${it.fechaCierre ? ' · Cerrado: '+formatFecha(it.fechaCierre) : ''}</div>
        <div class="chevron">Toca para ver el detalle completo →</div>
      </a>`;
    }).join('');
  }
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    tabActual = tab.dataset.tab;
    render();
  });
});
document.getElementById('searchInput').addEventListener('input', render);

cargar();
setInterval(cargar, 120000);
// Al volver a la pestaña (o recuperar señal) después de estar oculta/offline,
// refresca de una vez en vez de esperar hasta el próximo intervalo de 2 minutos.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cargar(); });
window.addEventListener('online', cargar);
</script>
</body>
</html>
