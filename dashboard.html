<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permisos · Portal SSTA</title>
<link rel="stylesheet" href="common.css">
<style>
  body{margin:0;font-family:var(--font-family,-apple-system,sans-serif);background:var(--bg,#eef1f4);color:var(--ink,#1a1a1a);padding:1.5rem 1rem 3rem;}
  .wrapper{max-width:760px;margin:0 auto;}
  .header{background:var(--ink,#151b24);border-radius:14px;padding:1.1rem 1.4rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow-lift);}
  .header h1{font-family:var(--font-display);font-size:17px;margin:0;color:#fff;font-weight:700;}
  .header a{font-size:12.5px;color:#ffd84d;text-decoration:none;font-weight:600;}

  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab{flex:1;text-align:center;padding:11px 8px;border-radius:10px;border:1.5px solid var(--line,#d9d9d9);background:var(--paper,#fff);font-size:13px;font-weight:700;color:var(--ink-soft,#666);cursor:pointer;}
  .tab.active{background:var(--ink,#151b24);color:#fff;border-color:var(--ink,#151b24);}
  .tab .count{margin-left:5px;opacity:.75;}

  .searchbar{margin-bottom:12px;}
  .searchbar input{width:100%;box-sizing:border-box;border:1.5px solid var(--line,#d9d9d9);border-radius:10px;padding:12px 14px;font-size:15px;background:var(--paper,#fff);}

  .refresh-note{font-size:11.5px;color:var(--ink-soft,#888);margin:0 0 1rem;}

  /* Aviso de backends que no respondieron. Rojo y arriba de la lista a
     propósito: significa que la lista está INCOMPLETA, y en un tablero de
     permisos una lista incompleta que parece completa es una falsa tranquilidad. */
  .aviso-incompleto{display:none;background:#fdecea;border:1.5px solid #c0392b;color:#7a1f14;
    border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:13px;line-height:1.5;}
  .aviso-incompleto b{display:block;font-size:14px;margin-bottom:2px;}
  .aviso-incompleto ul{margin:6px 0 8px;padding-left:18px;}
  .aviso-incompleto button{min-height:var(--touch,44px);padding:0 16px;border:none;border-radius:8px;
    background:#c0392b;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
  .empty.incompleto{border:1.5px solid #c0392b;color:#7a1f14;background:#fdecea;}
  .list{display:flex;flex-direction:column;gap:10px;}
  .item{display:block;background:var(--paper,#fff);border:1px solid var(--line,#d9d9d9);border-radius:12px;padding:.9rem 1.1rem;border-left:5px solid #F2C200;transition:.15s;text-decoration:none;color:inherit;}
  .item:active{transform:scale(.99);}
  .item.warn{border-left-color:var(--warn,#c0392b);background:linear-gradient(90deg, rgba(192,57,43,.05), transparent 40%);}
  .item.closed{border-left-color:var(--ink-muted,#5c6a76);}
  .item .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .icon-type{font-size:15px;margin-right:4px;}
  .code{font-family:var(--font-display);font-weight:700;background:var(--ink,#123a63);color:#fff;padding:3px 9px;border-radius:5px;font-size:12px;letter-spacing:.02em;}
  .tipo{font-size:11px;color:var(--ink-soft,#888);text-transform:uppercase;letter-spacing:.3px;}
  .tiempo{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .tiempo.ok{color:var(--ok,#1d7a4c);background:rgba(29,122,76,.1);}
  .tiempo.warn{color:var(--warn,#c0392b);background:rgba(192,57,43,.12);}
  .tiempo.closed{color:#5c6570;background:rgba(90,100,110,.1);}
  /* Por vencer: ámbar, un aviso distinto del rojo de "ya venció". */
  .tiempo.pronto{color:#8a6800;background:rgba(224,168,0,.18);}
  .item.v-vencido{border-left-color:var(--warn,#c0392b);background:linear-gradient(90deg, rgba(192,57,43,.07), transparent 45%);}
  .item.v-porvencer{border-left-color:#e0a800;background:linear-gradient(90deg, rgba(224,168,0,.09), transparent 45%);}
  .item.v-vigente{border-left-color:var(--ok,#1d7a4c);}
  .meta{font-size:12px;color:var(--ink-soft,#666);margin-top:6px;}
  .chevron{font-size:var(--fs-menor,12.5px);color:var(--ink-muted,#5c6a76);margin-top:3px;}
  .empty{background:var(--paper,#fff);border:1px solid var(--line,#d9d9d9);border-radius:14px;padding:2rem;text-align:center;color:var(--ink-soft,#888);font-size:13px;}
  .loading{text-align:center;color:#888;font-size:13px;padding:2rem;}

  /* Tarjeta de persona con EPP pendiente de reponer. Antes esta información
     solo existía persona por persona dentro del módulo de EPP, o en el correo
     del día: quien supervisa no tenía dónde ver de una sola vez qué le debe
     a la cuadrilla. */
  .item.epp{border-left-color:var(--warn,#c0392b);}
  .item.epp .elementos{font-size:12.5px;color:var(--ink,#151b24);margin-top:6px;line-height:1.55;}
  .item.epp .elementos li{margin-bottom:2px;}
  .item.epp ul{margin:4px 0 0;padding-left:18px;}
  .desde{font-size:11.5px;color:var(--ink-soft,#5c6a76);margin-top:5px;}
  .desde b{color:var(--warn,#c0392b);}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>📋 Permisos</h1>
    <a href="index.html">← Volver al portal</a>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabAbiertos" data-tab="abiertos">Abiertos <span class="count" id="countAbiertos"></span></div>
    <div class="tab" id="tabCerrados" data-tab="cerrados">Histórico cerrados <span class="count" id="countCerrados"></span></div>
  </div>

  <div class="searchbar">
    <input type="text" id="searchInput" placeholder="Buscar por código, responsable o tipo…">
  </div>

  <p class="refresh-note" id="refreshNote">Cargando…</p>
  <div class="aviso-incompleto" id="avisoIncompleto" role="alert"></div>
  <div class="list" id="list"></div>
</div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
OfflineBanner.init();

// Mismos backends/token usados en los formularios de permisos.
// Umbral (horas) a partir del cual un permiso abierto se marca en rojo.
const HORAS_ALERTA = 8;
// Antes este arreglo estaba copiado a mano aquí, en index.html y en
// personal-autorizado.html — ahora los tres lo calculan desde config.js,
// así cambiar una URL de backend solo implica editar un archivo.
const PERMIT_BACKENDS = getPermitBackends(false);
// El dashboard mostraba solo los 5 permisos: las inspecciones de EPP vivían en
// otra pantalla, así que había que mirar en dos sitios para saber qué estaba
// pendiente. Aquí se suma la tercera pestaña.
const EPP_BACKEND = PORTAL_CONFIG.BACKENDS.epp;

function iconoPara(nombre){
  if(nombre.includes('Caliente')) return '🔥';
  if(nombre.includes('Confinados')) return '🕳️';
  if(nombre.includes('Izajes')) return '🏗️';
  if(nombre.includes('Eléctrico')) return '⚡';
  return '🧗';
}
/* ── Vencimiento real ──
   El dashboard mostraba solo cuántas horas llevaba abierto un permiso, con un
   umbral fijo de 8 horas igual para todos. Pero cada permiso declara su propia
   vigencia ("hasta" fecha y hora) y ese dato ya estaba guardado sin usarse.
   Para quien supervisa, "vence en 2h" dice mucho más que "lleva 6h abierto". */
function fechaVencimiento(it){
  if(!it.hastaFecha) return null;
  // Se guarda como AAAA-MM-DD y HH:MM. Se arma en hora local, no en UTC: con
  // UTC un permiso que vence a las 6pm aparecía venciendo a la 1pm.
  const [a,m,d] = String(it.hastaFecha).split('-').map(Number);
  if(!a || !m || !d) return null;
  const [hh,mm] = String(it.hastaHora || '23:59').split(':').map(Number);
  const f = new Date(a, m-1, d, isNaN(hh)?23:hh, isNaN(mm)?59:mm, 0, 0);
  return isNaN(f.getTime()) ? null : f;
}

function estadoVigencia(it){
  const vence = fechaVencimiento(it);
  if(!vence) return null;                       // permiso sin vigencia declarada
  const minutos = Math.round((vence.getTime() - Date.now()) / 60000);
  const abs = Math.abs(minutos);
  const texto = abs < 60
    ? abs + ' min'
    : (abs < 1440 ? (abs/60).toFixed(abs/60 < 10 ? 1 : 0) + ' h' : Math.round(abs/1440) + ' d');
  if(minutos < 0)  return { nivel:'vencido',  texto:'VENCIDO hace ' + texto, minutos };
  if(minutos <= 60) return { nivel:'porvencer', texto:'Vence en ' + texto, minutos };
  return { nivel:'vigente', texto:'Vence en ' + texto, minutos };
}

function horasDesde(fechaStr){
  const t = new Date(fechaStr).getTime();
  if(isNaN(t)) return null;
  return (Date.now() - t) / 36e5;
}
function formatHoras(h){
  if(h===null) return '—';
  if(h < 1) return Math.round(h*60)+' min';
  return h.toFixed(1)+' h';
}
function formatFecha(fechaStr){
  const t = new Date(fechaStr);
  if(isNaN(t.getTime())) return '—';
  return t.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + t.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
}

let abiertos = [];
let cerrados = [];
// Tipos de permiso cuyo backend NO respondió en la última consulta:
// [{nombre, motivo}]. Mientras haya alguno, la lista está incompleta.
let fallidos = [];
// null = todavía no se ha consultado nada (no se puede afirmar nada).
let ultimaConsulta = null;
let tabActual = 'abiertos';
let eppPendientes = [];   // [{nombre, cedula, cargo, fecha, inspector, elementos[]}]
let eppCargado = false;

async function cargar(){
  // Si la pestaña está oculta (en segundo plano) o no hay señal, no tiene sentido
  // consultar los 5 backends — antes esto se disparaba igual cada 2 minutos aunque
  // nadie estuviera mirando el dashboard, gastando cuota de ejecución de Apps
  // Script sin ninguna necesidad real.
  if (document.hidden || !navigator.onLine) return;
  const noteEl = document.getElementById('refreshNote');
  const nAbiertos = [], nCerrados = [], nFallidos = [];
  // Se consultan los 5 backends EN PARALELO (no uno detrás de otro): si alguno
  // está caído o lento, ya no retrasa a los demás — antes, con un backend caído,
  // la carga completa del dashboard podía tardar 10-15 segundos.
  const resultados = await Promise.allSettled(PERMIT_BACKENDS.map(backend =>
    fetchWithRetry(backend.url + '?' + (backend.listQuery || 'list=1') + '&token=' + encodeURIComponent(backend.token))
      .then(res => res.json())
      .then(data => ({ backend, data }))
  ));
  // ANTES un backend caído se omitía en silencio: si justo ese tenía el único
  // permiso abierto, el tablero mostraba "No hay permisos abiertos ✓".
  // Ahora cada tipo que no respondió queda registrado con su motivo.
  resultados.forEach((r, i)=>{
    if(r.status !== 'fulfilled'){
      const err = r.reason;
      const motivo = (err && err.name === 'SyntaxError')
        ? 'respondió con una página en vez de datos (¿despliegue privado o URL cambiada?)'
        : 'no respondió (sin señal o servidor caído)';
      nFallidos.push({ nombre: PERMIT_BACKENDS[i].nombre, motivo });
      return;
    }
    const { backend, data } = r.value;
    if(!data || !data.ok || !Array.isArray(data.rows)){
      nFallidos.push({ nombre: backend.nombre, motivo: 'respondió con error: ' + ((data && data.error) || 'sin detalle') });
      return;
    }
    data.rows.forEach(row=>{
        const item = {
          tipo: backend.nombre,
          archivo: backend.archivo,
          icono: iconoPara(backend.nombre),
          code: row.code || row.permitCode || '—',
          responsable: row.responsable || '',
          area: row.sitio || row.area || '',
          hastaFecha: row.hastaFecha || '',
          hastaHora: row.hastaHora || '',
          fechaApertura: row.openedAt || row.updatedAt || null,
          fechaCierre: row.status === 'CERRADO' ? (row.closedAt || row.updatedAt || null) : null
        };
        if(row.status === 'ABIERTO') nAbiertos.push(item);
        else if(row.status === 'CERRADO') nCerrados.push(item);
      });
  });
  abiertos = nAbiertos; cerrados = nCerrados; fallidos = nFallidos;
  ultimaConsulta = new Date();
  // Orden por urgencia real: primero lo vencido, luego lo que está por vencer,
  // y al final lo que tiene margen. Los que no declaran vigencia se ordenan
  // como antes, por tiempo abierto.
  abiertos.sort((a,b)=>{
    const va = estadoVigencia(a), vb = estadoVigencia(b);
    if(va && vb) return va.minutos - vb.minutos;      // menos minutos = más urgente
    if(va) return -1;
    if(vb) return 1;
    return (horasDesde(b.fechaApertura)||0) - (horasDesde(a.fechaApertura)||0);
  });
  cerrados.sort((a,b)=> new Date(b.fechaCierre||0) - new Date(a.fechaCierre||0));

  document.getElementById('countAbiertos').textContent = abiertos.length ? '('+abiertos.length+')' : '';
  document.getElementById('countCerrados').textContent = cerrados.length ? '('+cerrados.length+')' : '';
  noteEl.textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-CO', {hour:'2-digit',minute:'2-digit'}) + ' — se refresca solo cada 2 minutos.';
  mostrarAvisoIncompleto();
  render();
}

/* ── EPP pendiente de reponer ──
   Se toma la ÚLTIMA inspección de cada persona, no la suma de todas: sumar el
   historial mostraría como pendiente lo que ya le repusieron hace meses, y
   este es justo el listado que se usa para reclamarle a almacén. */
async function cargarEpp(){
  if(!EPP_BACKEND || !EPP_BACKEND.url || EPP_BACKEND.url.indexOf('http')!==0) return;
  try{
    const res = await fetchWithRetry(EPP_BACKEND.url + '?list=1&token=' + encodeURIComponent(PORTAL_CONFIG.API_TOKEN));
    const data = await res.json();
    if(!data.ok || !Array.isArray(data.rows)) return;
    const ultimaPorPersona = {};
    data.rows.forEach(r=>{
      const cc = String(r.cedula||'').trim() || String(r.nombre||'').trim();
      if(!cc) return;
      const previa = ultimaPorPersona[cc];
      if(!previa || new Date(r.updatedAt) > new Date(previa.updatedAt)) ultimaPorPersona[cc] = r;
    });
    eppPendientes = Object.values(ultimaPorPersona)
      .map(r=>({
        nombre: r.nombre||'—', cedula: r.cedula||'', cargo: r.cargo||'',
        fecha: r.fechaInspeccion||'', inspector: r.inspector||'', updatedAt: r.updatedAt,
        elementos: String(r.malos||'').split('|').map(x=>x.trim()).filter(Boolean)
      }))
      .filter(p=>p.elementos.length);
    eppPendientes.sort((a,b)=> new Date(a.updatedAt) - new Date(b.updatedAt)); // lo más viejo primero: es lo más atrasado
    eppCargado = true;
    document.getElementById('countEpp').textContent = eppPendientes.length ? '('+eppPendientes.length+')' : '';
  }catch(e){ /* sin señal o backend no configurado: la pestaña queda vacía */ }
}

function diasDesde(v){
  const t = new Date(v).getTime();
  if(isNaN(t)) return null;
  return Math.floor((Date.now()-t)/86400000);
}

function renderEpp(listEl, q){
  let items = eppPendientes;
  if(q){
    items = items.filter(p =>
      p.nombre.toLowerCase().includes(q) || String(p.cedula).toLowerCase().includes(q) ||
      p.cargo.toLowerCase().includes(q) || p.inspector.toLowerCase().includes(q) ||
      p.elementos.join(' ').toLowerCase().includes(q));
  }
  if(!items.length){
    listEl.innerHTML = '<div class="empty">'+(eppCargado
      ? (q ? 'No hay resultados para la búsqueda.' : 'No hay elementos de protección pendientes de reponer ✓')
      : 'Cargando inspecciones de EPP…')+'</div>';
    return;
  }
  listEl.innerHTML = items.map(p=>{
    const d = diasDesde(p.updatedAt);
    const espera = d===null ? '' : (d===0 ? 'hoy' : (d===1 ? 'hace 1 día' : 'hace '+d+' días'));
    return `<a class="item epp" href="inspeccion-epp.html">
      <div class="row1">
        <span><span class="icon-type">🦺</span><span class="code">${esc(p.nombre)}</span> <span class="tipo">${esc(p.cargo||'')}</span></span>
        <span class="tiempo warn">${p.elementos.length} elemento(s)</span>
      </div>
      <div class="elementos"><ul>${p.elementos.map(e=>'<li>'+esc(e)+'</li>').join('')}</ul></div>
      <div class="desde">Solicitado <b>${esc(espera)}</b>${p.fecha?' · inspección del '+esc(p.fecha):''}${p.inspector?' · revisó '+esc(p.inspector):''}</div>
      <div class="chevron">Toca para abrir la inspección de EPP →</div>
    </a>`;
  }).join('');
}

/** Aviso arriba de la lista con los tipos de permiso que no respondieron. */
function mostrarAvisoIncompleto(){
  const el = document.getElementById('avisoIncompleto');
  if(!fallidos.length){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.innerHTML = '<b>⚠️ Lista incompleta</b>' +
    'No se pudieron consultar estos permisos, así que los suyos <u>no aparecen</u> abajo:' +
    '<ul>' + fallidos.map(f => '<li><b style="display:inline">' + esc(f.nombre) + '</b>: ' + esc(f.motivo) + '</li>').join('') + '</ul>' +
    '<button type="button" id="btnReintentarTablero">Reintentar ahora</button>';
  el.style.display = 'block';
  document.getElementById('btnReintentarTablero').addEventListener('click', (e)=>{
    e.target.textContent = 'Consultando…'; e.target.disabled = true;
    cargar();
  });
}

function render(){
  const listEl = document.getElementById('list');
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(tabActual === 'epp'){ renderEpp(listEl, q); return; }
  let items = tabActual === 'abiertos' ? abiertos : cerrados;
  if(q){
    items = items.filter(it =>
      it.code.toLowerCase().includes(q) ||
      it.tipo.toLowerCase().includes(q) ||
      (it.responsable||'').toLowerCase().includes(q) ||
      (it.area||'').toLowerCase().includes(q)
    );
  }

  if(items.length===0){
    let msg;
    if(tabActual==='abiertos'){
      if(q) msg = 'Ningún permiso abierto coincide con la búsqueda.';
      // El chulo verde SOLO cuando los 5 tipos respondieron. Con uno caído no
      // se puede afirmar que no haya permisos abiertos: se dice lo que se sabe.
      else if(fallidos.length) msg = '⚠️ No se puede confirmar que no haya permisos abiertos: faltan datos de ' + fallidos.map(f=>esc(f.nombre)).join(', ') + '.';
      else msg = 'No hay permisos abiertos en este momento ✓';
    } else {
      msg = fallidos.length ? '⚠️ Faltan datos de ' + fallidos.map(f=>esc(f.nombre)).join(', ') + '. La lista puede estar incompleta.' : 'No hay permisos cerrados que coincidan con la búsqueda.';
    }
    listEl.innerHTML = `<div class="empty${fallidos.length && !q ? ' incompleto' : ''}">${msg}</div>`;
    return;
  }

  if(tabActual==='abiertos'){
    listEl.innerHTML = items.map(it=>{
      const h = horasDesde(it.fechaApertura);
      const v = estadoVigencia(it);
      // Si el permiso declara vigencia, manda ella. Si no (permisos viejos), se
      // sigue usando el umbral de horas abiertas como antes.
      const alerta = v ? (v.nivel !== 'vigente') : (h!==null && h >= HORAS_ALERTA);
      const clase = v ? ('v-' + v.nivel) : (alerta ? 'warn' : '');
      const etiqueta = v
        ? `<span class="tiempo ${v.nivel==='vencido'?'warn':(v.nivel==='porvencer'?'pronto':'ok')}">${esc(v.texto)}</span>`
        : `<span class="tiempo ${alerta?'warn':'ok'}">${formatHoras(h)} abierto</span>`;
      return `<a class="item ${clase}" href="${it.archivo}?code=${encodeURIComponent(it.code)}">
        <div class="row1">
          <span><span class="icon-type">${it.icono}</span><span class="code">${esc(it.code)}</span> <span class="tipo">${it.tipo}</span></span>
          ${etiqueta}
        </div>
        <div class="meta">${it.responsable ? 'Responsable: '+esc(it.responsable) : ''}${it.area ? ' · Área: '+esc(it.area) : ''}${v ? ' · Abierto hace '+formatHoras(h) : ''}</div>
        <div class="chevron">Toca para abrir el permiso y cerrarlo →</div>
      </a>`;
    }).join('');
  } else {
    listEl.innerHTML = items.map(it=>{
      return `<a class="item closed" href="${it.archivo}?code=${encodeURIComponent(it.code)}">
        <div class="row1">
          <span><span class="icon-type">${it.icono}</span><span class="code">${esc(it.code)}</span> <span class="tipo">${it.tipo}</span></span>
          <span class="tiempo closed">Cerrado</span>
        </div>
        <div class="meta">${it.responsable ? 'Responsable: '+esc(it.responsable) : ''}${it.area ? ' · Área: '+esc(it.area) : ''}${it.fechaCierre ? ' · Cerrado: '+formatFecha(it.fechaCierre) : ''}</div>
        <div class="chevron">Toca para ver el detalle completo →</div>
      </a>`;
    }).join('');
  }
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    tabActual = tab.dataset.tab;
    render();
  });
});
document.getElementById('searchInput').addEventListener('input', render);

cargar();
setInterval(cargar, 120000);
// Al volver a la pestaña (o recuperar señal) después de estar oculta/offline,
// refresca de una vez en vez de esperar hasta el próximo intervalo de 2 minutos.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cargar(); });
window.addEventListener('online', cargar);

// El dashboard nunca registraba el Service Worker — si alguien entraba por un
